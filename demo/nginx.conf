# The demo's nginx (demo/run.py writes /run/iretail-demo/nginx.conf from
# this file): the start page on 8080 and, for each store, its port with the
# back office at / and the register at /register/, both browser builds, and
# the store's API on the same origin, so the browser makes no cross-origin
# call.
worker_processes 2;
pid /run/iretail-demo/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types application/javascript application/json text/css text/plain application/wasm;
  client_body_temp_path /run/iretail-demo/nginx-body;
  proxy_temp_path /run/iretail-demo/nginx-proxy;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    root /run/iretail-demo/www;
    location / {
      add_header Cache-Control "no-store" always;
      try_files $uri /index.html;
    }
    # What the emulated printers printed, newest last (the emulator's
    # control API).
    location /devices/ {
      proxy_pass http://127.0.0.1:8090/;
    }
  }
@STORES@
}
